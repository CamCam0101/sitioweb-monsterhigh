<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster High - El Laboratorio de Moda Retro</title>
  
  <!-- Conexión al archivo CSS externo -->
  <link rel="stylesheet" href="fashion.css">
  <link rel="stylesheet" href="css/menu_nav.css">
</head>
<body>

  <!-- Elemento Decorativo: Matraz de Laboratorio en la esquina de la pantalla -->
  <div class="decoracion-matraz">🧪</div>

  <!-- Encabezado Estilo Y2K Grunge -->
  <header class="header-retro">
    <div class="contenedor-cabecera">
      <span class="calavera-decorativa">💀</span>
      <h1 class="titulo-juego">FASHION LAB</h1>
      <span class="calavera-decorativa">💀</span>
    </div>
    <p class="subtitulo-juego">¡Crea tu defecto perfecto de la moda!</p>
  </header>

  <!-- Contenedor Principal (Gran Marco con textura) -->
  <main class="marco-pantalla-juego">
    
    <div class="interfaz-closet">
      
      <!-- LÓGICA DE CONTROLADORES: Inputs ocultos para alternar la ropa -->
      <input type="radio" name="outfit-monster" id="outfit-original" checked>
      <input type="radio" name="outfit-monster" id="outfit-haunted">
      <input type="radio" name="outfit-monster" id="outfit-scarier">

      <!-- MENÚ DE ATAÚD (Panel Izquierdo Interactivo) -->
      <!-- Usamos combinaciones de clases y etiquetas semánticas -->
      <nav class="menu-ataud-izquierda">
        <h3 class="titulo-perchero">PRENDAS</h3>
        
        <!-- Los labels se vinculan por ID y actúan como los botones Flash -->
        <label for="outfit-original" class="boton-skull-vibe">
          <span class="viñeta-moño">🎀</span> Básico Glam
        </label>
        
        <label for="outfit-haunted" class="boton-skull-vibe">
          <span class="viñeta-moño">🎀</span> Haunted Look
        </label>
        
        <label for="outfit-scarier" class="boton-skull-vibe">
          <span class="viñeta-moño">🎀</span> Scarrier Reef
        </label>
      </nav>

      <!-- ÁREA DEL MANIQUÍ (Caja Central de Visualización) -->
      <section class="pantalla-maniqui">
        
        <!-- Cuerpo de la muñeca (Capa Base estática) -->
        <img src="https://unsplash.com" alt="Muñeca Base" class="capa-textura cuerpo-maniqui">
        
        <!-- Prendas que reaccionan al hacer clic en los botones -->
        <img src="https://unsplash.com" alt="Estilo Básico" class="capa-textura prenda-basica">
        <img src="https://unsplash.com" alt="Estilo Haunted" class="capa-textura prenda-haunted">
        <img src="https://unsplash.com" alt="Estilo Scarrier" class="capa-textura prenda-scarrier">
        
      </section>

      <!-- PANEL DE NOTAS / DETALLES (Estilo bitácora científica de la derecha) -->
      <aside class="panel-bitacora-derecha">
        <h4 class="titulo-nota">Monster Diario</h4>
        <p class="texto-nota">Intercambia los estilos usando el panel de ataúd izquierdo. ¡No olvides combinar tus accesorios horroríficos!</p>
      </aside>

    </div>

  </main>

  <footer class="pie-retro">
    <p>&copy; 2000-2012 Monster High Web - Sección Recuperada (Lost Media Vibe)</p>
  </footer>

</body>
</html>
